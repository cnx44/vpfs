# Frozen copy of the pre-refactor implementation, kept as a behavioural oracle.
# The e2e suites in ../tests are compiled against this crate too:
#   cargo test --manifest-path legacy/Cargo.toml
[package]
name = "vpfs-legacy"
version = "0.1.0"
edition = "2024"

[features]
# Lets the shared e2e tests tell which implementation they are compiled against.
default = ["legacy"]
legacy = []

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
iroh = "0.95.1"
libc = "0.2.182"
lru = "0.16.3"
n0-future = "0.3.1"
rand = "0.9.2"
serde = "1.0.228"
serde_bare = "0.5.0"
tokio = "1.49.0"

[lib]
name = "vpfs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name="daemon"
path="src/daemon.rs"

[[bin]]
name="sh"
path="src/applications/sh.rs"

[[bin]]
name="cat"
path="src/applications/cat.rs"

[[bin]]
name="cat2"
path="src/applications/cat2.rs"

[[bin]]
name="conflict_resolver"
path="src/conflict_resolver.rs"

[[test]]
name = "e2e_single_node"
path = "../tests/e2e_single_node.rs"

[[test]]
name = "e2e_two_node"
path = "../tests/e2e_two_node.rs"
